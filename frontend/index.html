<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Repo Watch</title><link rel="stylesheet" href="style.css"></head>
<body><main class="widget"><header class="top"><div class="brand"><img class="brand-mark" src="logo.svg" alt=""><div><h1>Repo Watch</h1><small>仓库动态，一眼掌握</small></div></div><div class="toolbar"><button id="pin" class="icon" title="窗口置顶" aria-label="窗口置顶" aria-pressed="false">⌖</button><button id="refresh" class="icon" title="刷新全部" aria-label="刷新全部">↻</button><button id="openForm" class="add" title="添加仓库" aria-label="添加仓库">＋</button></div></header><div class="status"><span class="dot"></span><span id="lastUpdate">后台监控中</span><span class="interval">每 10 分钟刷新</span></div><section class="list-head"><span>正在关注 <b id="count">0</b></span><span>仓库 / REPOS</span></section><div id="notice" role="status" aria-live="polite"></div><div id="cards" class="cards"></div><div id="empty" class="empty"><div class="empty-icon">⌘</div><h2>添加你的第一个仓库</h2><p>支持 GitHub、Codeberg 和 Gitea</p><button class="primary" id="emptyAdd">＋ 添加仓库</button></div><footer><span>REPO WATCH</span><span>关闭窗口后继续监控</span></footer></main>
<dialog id="dialog"><form id="form"><div class="modal-top"><div><small>NEW REPOSITORY</small><h2>添加仓库</h2></div><button type="button" class="close" id="close" aria-label="关闭">×</button></div><label>仓库链接 <span>可选</span><input id="repoUrl" placeholder="https://github.com/owner/repo" autocomplete="off"></label><label>平台<select id="platform"><option value="github">GitHub</option><option value="codeberg">Codeberg</option><option value="gitea">Gitea（自建）</option></select></label><div class="row"><label>Owner<input id="owner" required placeholder="例如 egoist" autocomplete="off"></label><label>Repository<input id="repo" required placeholder="例如 mygo" autocomplete="off"></label></div><label id="baseWrap" hidden>Gitea 实例地址<input id="baseUrl" placeholder="https://git.example.com" autocomplete="off"></label><label>访问令牌 <span>私有仓库需要</span><input id="token" type="password" placeholder="公开仓库可留空" autocomplete="off"><small>令牌安全保存在 Windows 凭据管理器；需要 HTTPS。</small></label><div id="formError" class="error" role="alert"></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">添加仓库</button></div></form></dialog>
<dialog id="credentialDialog"><form id="credentialForm"><div class="modal-top"><div><small>ACCESS TOKEN</small><h2>仓库访问令牌</h2></div><button type="button" class="close" id="credentialClose" aria-label="关闭">×</button></div><p id="credentialRepo" class="hint"></p><label>新令牌<input id="newToken" type="password" autocomplete="off" placeholder="输入令牌以设置或替换"><small>令牌保存在 Windows 凭据管理器，不会显示已保存的令牌。</small></label><div id="credentialError" class="error" role="alert"></div><div class="modal-actions"><button type="button" class="secondary" id="credentialClear">清除令牌</button><button type="submit" class="primary">保存令牌</button></div></form></dialog><script src="app.js"></script></body></html>
