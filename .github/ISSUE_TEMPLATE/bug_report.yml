name: Bug report
description: 报告可以复现的问题
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述和复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果和实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 版本、Repo Watch 版本或提交
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息（请移除令牌和私人数据）
